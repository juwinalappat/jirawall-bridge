<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>JIRAWall YouTube bridge</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0}</style>
</head>
<body>
<div id="p"></div>
<script>
// Hosted on a normal https page so YouTube sees a Referer. The new tab talks to this page with postMessage.
// Plan A: YouTube's player script. Plan B (if that script is blocked): a plain embed driven by postMessage.
(function () {
  var VER = 6;
  var q = new URLSearchParams(location.search);
  var list = q.get('list'), video = q.get('video');
  var wantVol = clamp(Number(q.get('volume') || 55));
  var wantMuted = q.get('muted') === '1';
  var wantLoop = q.get('loop') !== '0';
  var player = null, ready = false, apiReady = false, failed = false, fb = null, showFn = null;

  function clamp(n) { return isNaN(n) ? 55 : Math.max(0, Math.min(100, n)); }
  function send(m) { try { window.parent.postMessage(m, '*'); } catch (e) {} }
  function say(t) { if (showFn) showFn(t); }
  function stage(t) { send({ type: 'JW_STAGE', text: t }); say(t); }
  function fail(code, t) { failed = true; send({ type: 'JW_ERROR', code: code }); say('FAILED: ' + t); }

  function pushState() {
    if (!ready) return;
    var d = {};
    try { d = player.getVideoData() || {}; } catch (e) {}
    send({
      type: 'JW_STATE',
      state: player.getPlayerState(),
      title: d.title || '', author: d.author || '', videoId: d.video_id || '',
      time: player.getCurrentTime() || 0, duration: player.getDuration() || 0,
      volume: player.getVolume(), muted: player.isMuted()
    });
  }

  function onReady() {
    ready = true;
    player.mute();                      // muted start is always allowed to autoplay
    player.setVolume(wantVol);
    if (list) player.setLoop(wantLoop);
    player.playVideo();
    send({ type: 'JW_READY' });
    say('Player ready');
    setInterval(pushState, 1000);
  }

  function onState(e) {
    if (e.data === 1 && !wantMuted && player.isMuted()) { player.unMute(); player.setVolume(wantVol); }
    if (e.data === 0 && !list && wantLoop) { player.seekTo(0, true); player.playVideo(); }
    pushState();
  }

  // ---- Plan A: official player script
  window.onYouTubeIframeAPIReady = function () {
    if (fb) return;
    apiReady = true;
    stage('YouTube player code loaded, creating player');
    var vars = { autoplay: 1, controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, origin: location.origin };
    if (list) { vars.listType = 'playlist'; vars.list = list; }
    var opts = {
      width: '100%', height: '100%',
      playerVars: vars,
      events: {
        onReady: function () { if (!fb) onReady(); },
        onStateChange: function (e) { if (!fb) onState(e); },
        onError: function (e) { fail(e.data, 'YouTube error ' + e.data); }
      }
    };
    if (!list) opts.videoId = video;     // a playlist must NOT carry a videoId key, even an empty one: YouTube throws "Invalid video id"
    try {
      player = new YT.Player('p', opts);
    } catch (err) {
      startFallback('player script error: ' + (err && err.message));
      return;
    }
    setTimeout(function () { if (!ready && !fb) startFallback('player did not answer'); }, 8000);
  };

  // ---- Plan B: plain embed, controlled with YouTube's postMessage commands
  function startFallback(why) {
    if (fb || ready) return;
    fb = { state: -1, time: 0, dur: 0, vol: wantVol, muted: true, vd: {}, seen: false };
    stage('Trying direct embed (' + why + ')');
    var u = 'https://www.youtube.com/embed/' + (list ? 'videoseries' : encodeURIComponent(video)) +
      '?enablejsapi=1&autoplay=1&mute=1&controls=0&rel=0&playsinline=1&modestbranding=1&origin=' + encodeURIComponent(location.origin) +
      (list ? '&list=' + encodeURIComponent(list) : '&loop=1&playlist=' + encodeURIComponent(video));
    var f = document.createElement('iframe');
    f.allow = 'autoplay *; encrypted-media *; picture-in-picture *';
    f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0';
    f.src = u;
    var host = document.getElementById('p'); host.innerHTML = ''; host.appendChild(f);
    function cmd(func, args) {
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'command', func: func, args: args === undefined ? '' : args }), 'https://www.youtube.com'); } catch (e) {}
    }
    function listen() {
      try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'jw', channel: 'widget' }), 'https://www.youtube.com'); } catch (e) {}
    }
    player = {
      mute: function () { fb.muted = true; cmd('mute'); }, unMute: function () { fb.muted = false; cmd('unMute'); },
      isMuted: function () { return fb.muted; },
      setVolume: function (v) { fb.vol = v; cmd('setVolume', [v]); }, getVolume: function () { return fb.vol; },
      setLoop: function (b) { cmd('setLoop', [b]); }, playVideo: function () { cmd('playVideo'); }, pauseVideo: function () { cmd('pauseVideo'); },
      nextVideo: function () { cmd('nextVideo'); }, previousVideo: function () { cmd('previousVideo'); },
      seekTo: function (t) { cmd('seekTo', [t, true]); },
      getVideoData: function () { return fb.vd; }, getPlayerState: function () { return fb.state; },
      getCurrentTime: function () { return fb.time; }, getDuration: function () { return fb.dur; }
    };
    f.addEventListener('load', listen);
    var poll = setInterval(function () { if (fb.seen) { clearInterval(poll); return; } listen(); }, 700);
    window.addEventListener('message', function (e) {
      if (e.origin !== 'https://www.youtube.com' || e.source !== f.contentWindow) return;
      var d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
      if (!d) return;
      if (d.event === 'onError') { fail(Number(d.info) || -4, 'YouTube error ' + d.info); return; }
      if (!d.info || typeof d.info !== 'object') return;
      var i = d.info;
      if (i.videoData) { for (var k in i.videoData) fb.vd[k] = i.videoData[k]; }
      if (typeof i.currentTime === 'number') fb.time = i.currentTime;
      if (typeof i.duration === 'number') fb.dur = i.duration;
      if (typeof i.muted === 'boolean') fb.muted = i.muted;
      if (typeof i.volume === 'number') fb.vol = i.volume;
      if (typeof i.playerState === 'number') {
        var old = fb.state; fb.state = i.playerState;
        if (ready && old !== fb.state) onState({ data: fb.state });
      }
      if (!fb.seen) { fb.seen = true; onReady(); if (fb.state === 1) onState({ data: 1 }); }
    });
    setTimeout(function () { if (!ready && !failed) fail(-4, 'YouTube did not answer (blocked frame, ad blocker, or network)'); }, 10000);
  }

  // ---- commands from the page that embeds us
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;        // only the page that embeds us
    var m = e.data;
    if (m && m.type === 'JW_PING') { send({ type: 'JW_PONG', ver: VER }); return; }
    if (!m || m.type !== 'JW_CMD' || !ready) return;
    switch (m.cmd) {
      case 'play': player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'next': player.nextVideo(); break;
      case 'prev': player.previousVideo(); break;
      case 'volume':
        wantVol = clamp(Number(m.value)); player.setVolume(wantVol);
        if (wantVol > 0 && player.isMuted()) { player.unMute(); wantMuted = false; }
        break;
      case 'mute': wantMuted = true; player.mute(); break;
      case 'unmute': wantMuted = false; player.unMute(); break;
      case 'loop': wantLoop = !!m.value; if (list) player.setLoop(wantLoop); break;
      case 'seek': player.seekTo(Number(m.value) || 0, true); break;
    }
    setTimeout(pushState, 60);
  });

  // ---- opened directly in a tab (not inside the extension): small status box and Unmute button for testing
  if (window.parent === window) {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9;color:#fff;font:14px sans-serif;background:rgba(0,0,0,.75);padding:8px 12px;border-radius:8px;display:flex;gap:10px;align-items:center';
    var txt = document.createElement('span'); txt.textContent = 'Bridge test (version ' + VER + '): starting';
    showFn = function (t) { txt.textContent = 'Bridge test: ' + t; };
    var btn = document.createElement('button'); btn.textContent = 'Unmute'; btn.style.cssText = 'font:inherit;padding:4px 10px;cursor:pointer';
    btn.onclick = function () { if (player && ready) { wantMuted = false; player.unMute(); player.setVolume(wantVol); } };
    box.appendChild(txt); box.appendChild(btn); document.body.appendChild(box);
    setInterval(function () {
      if (!ready || failed) return;
      var d = {}; try { d = player.getVideoData() || {}; } catch (e) {}
      txt.textContent = 'State ' + player.getPlayerState() + (player.isMuted() ? ' (muted)' : ' (sound on)') + ' - ' + (d.title || 'no title yet');
    }, 500);
  }

  send({ type: 'JW_PONG', ver: VER });
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onload = function () { say('YouTube player code downloaded'); };
  s.onerror = function () { startFallback('player code blocked'); };
  document.head.appendChild(s);
  setTimeout(function () { if (!apiReady && !fb) startFallback('player code did not start'); }, 4000);
  window.addEventListener('error', function (e) { say('Script error: ' + (e.message || 'unknown')); });
  stage('Loading YouTube player code');
})();
</script>
</body>
</html>
